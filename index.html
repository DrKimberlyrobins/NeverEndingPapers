<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Never Ending Papers</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #242424 0%, #070707 78%);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Vertical phone stage */
.stage {
    width: min(100vw, 500px);
    height: 100vh;
    margin: auto;
    position: relative;
    overflow: hidden;
}

/* Cork board */
.board {
    position: absolute;
    width: 90%;
    height: 82%;
    left: 5%;
    top: 9%;

    background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.16), transparent 25%),
        #d8bd8b;

    border: 11px solid #744b2a;
    border-radius: 10px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.7),
        inset 0 0 25px rgba(70,40,10,.22);

    overflow: hidden;
}

/* Every paper is its own object */
.paper {
    position: absolute;

    width: 100px;
    height: 90px;

    border-radius: 2px;

    box-shadow:
        3px 5px 7px rgba(0,0,0,.30);

    transform-origin: 50% 8%;

    /* Gives each paper a tiny curled-looking corner */
    overflow: hidden;
}

.paper::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;

    width: 15px;
    height: 15px;

    background: rgba(255,255,255,.18);

    clip-path: polygon(100% 0, 0 100%, 100% 100%);
}

/* Pushpin */
.pin {
    position: absolute;

    width: 10px;
    height: 10px;

    left: 50%;
    top: 5px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 2px 3px rgba(0,0,0,.55),
        inset -2px -2px 2px rgba(0,0,0,.18);

    pointer-events: none;
}
</style>
</head>

<body>

<div class="stage">
    <div class="board" id="board"></div>
</div>

<script>
const board = document.getElementById("board");

const colors = [
    "#ff4d5a",
    "#ffcf35",
    "#55df68",
    "#419df2",
    "#a85ff2",
    "#f566bd",
    "#ff9238",
    "#38d2d2",
    "#f4e65b",
    "#39c97d"
];

const pinColors = [
    "#ffffff",
    "#ff3030",
    "#ffd21f",
    "#278cff",
    "#7c3cff",
    "#18b94f"
];

/*
    Create 100 separate papers.

    They are deliberately NOT arranged in rows.
    Their positions overlap so viewers cannot
    easily tell how many are actually on the board.
*/

for (let i = 0; i < 100; i++) {

    const paper = document.createElement("div");
    paper.className = "paper";

    /* Random paper color */
    paper.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    /*
       Random position.
       Some papers deliberately overlap heavily.
    */
    const left = -5 + Math.random() * 82;
    const top = -3 + Math.random() * 88;

    paper.style.left = left + "%";
    paper.style.top = top + "%";

    /* Random angle */
    const rotation = Math.random() * 34 - 17;

    /* Slightly different paper sizes */
    const scale = 0.82 + Math.random() * 0.34;

    paper.style.transform =
        `rotate(${rotation}deg) scale(${scale})`;

    /*
       Later-created papers sit over earlier ones,
       creating the bunched-up layered appearance.
    */
    paper.style.zIndex = i + 1;

    /* Add a pushpin */
    const pin = document.createElement("div");
    pin.className = "pin";

    pin.style.background =
        pinColors[Math.floor(Math.random() * pinColors.length)];

    paper.appendChild(pin);
    board.appendChild(paper);
}
</script>

</body>
</html>
