<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Never Ending Papers</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #242424 0%, #070707 78%);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Vertical phone stage */
.stage {
    width: min(100vw, 500px);
    height: 100vh;
    margin: auto;
    position: relative;
    overflow: hidden;
}

/* Cork board */
.board {
    position: absolute;
    z-index: 1;
    width: 90%;
    height: 82%;
    left: 5%;
    top: 9%;

    background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.16), transparent 25%),
        #d8bd8b;

    border: 11px solid #744b2a;
    border-radius: 10px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.7),
        inset 0 0 25px rgba(70,40,10,.22);

    overflow: hidden;
}

/* Every paper is its own object */
.paper {
    position: absolute;

    width: 100px;
    height: 90px;

    border-radius: 2px;

    box-shadow:
        3px 5px 7px rgba(0,0,0,.30);

    transform-origin: 50% 8%;

    /* Gives each paper a tiny curled-looking corner */
    overflow: hidden;
}

.paper::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;

    width: 15px;
    height: 15px;

    background: rgba(255,255,255,.18);

    clip-path: polygon(100% 0, 0 100%, 100% 100%);
}

/* Pushpin */
.pin {
    position: absolute;

    width: 10px;
    height: 10px;

    left: 50%;
    top: 5px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: rgba(255,255,255,.92);

    box-shadow:
        0 2px 3px rgba(0,0,0,.55),
        inset -2px -2px 2px rgba(0,0,0,.18);

    pointer-events: none;
}
 /* =========================
   FLYING PAPERS
   ========================= */

let lastViewerThrow = 0;

function flyOnePaper() {

    const papers = Array.from(document.querySelectorAll(".paper"));

    if (papers.length === 0) return;

    /* Pick a random paper */
    const paper =
        papers[Math.floor(Math.random() * papers.length)];

    paper.style.zIndex = "600";

    /*
       Most papers fly normally.
       Occasionally one comes straight at the viewer.
    */
    const now = Date.now();

    const canThrowAtViewer =
        now - lastViewerThrow > 7000;

    const throwAtViewer =
        canThrowAtViewer && Math.random() < 0.22;

    if (throwAtViewer) {

        lastViewerThrow = now;

        /* PAPER COMES AT THE VIEWER */
        paper.style.transition =
            "transform 1.1s ease-in, opacity .25s ease-in 1s";

        setTimeout(() => {

            paper.style.transform =
                "translate(0px, 80px) rotate(35deg) scale(8)";

            paper.style.opacity = "0";

        }, 100);

        setTimeout(() => {
            paper.remove();
        }, 1400);

    } else {

        /* NORMAL RANDOM FLIGHT */

        const direction =
            Math.floor(Math.random() * 4);

        let x;
        let y;

        if (direction === 0) {
            x = -650;
            y = Math.random() * 300 - 150;
        }

        if (direction === 1) {
            x = 650;
            y = Math.random() * 300 - 150;
        }

        if (direction === 2) {
            x = Math.random() * 400 - 200;
            y = -700;
        }

        if (direction === 3) {
            x = Math.random() * 400 - 200;
            y = 700;
        }

        const spin =
            Math.random() * 900 - 450;

        paper.style.transition =
            "transform 1.5s ease-in, opacity .3s ease-in 1.2s";

        setTimeout(() => {

            paper.style.transform =
                `translate(${x}px, ${y}px)
                 rotate(${spin}deg)
                 scale(.75)`;

            paper.style.opacity = "0";

        }, 100);

        setTimeout(() => {
            paper.remove();
        }, 1700);
    }
}


/*
   SAME STEADY PACE.
   One paper starts flying every 1.4 seconds.
*/
setTimeout(() => {

    flyOnePaper();

    setInterval(() => {
        flyOnePaper();
    }, 1400);

}, 2000);

<script>
const board = document.getElementById("board");

const colors = [
    "#ff4d5a",
    "#ffcf35",
    "#55df68",
    "#419df2",
    "#a85ff2",
    "#f566bd",
    "#ff9238",
    "#38d2d2",
    "#f4e65b",
    "#39c97d"
];

const pinColors = [
    "#ffffff",
    "#ff3030",
    "#ffd21f",
    "#278cff",
    "#7c3cff",
    "#18b94f"
];

/*
    Create 100 separate papers.

    They are deliberately NOT arranged in rows.
    Their positions overlap so viewers cannot
    easily tell how many are actually on the board.
*/

for (let i = 0; i < 100; i++) {

    const paper = document.createElement("div");
    paper.className = "paper";

    /* Random paper color */
    paper.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    /*
       Random position.
       Some papers deliberately overlap heavily.
    */
    const left = -5 + Math.random() * 82;
    const top = -3 + Math.random() * 88;

    paper.style.left = left + "%";
    paper.style.top = top + "%";

    /* Random angle */
    const rotation = Math.random() * 34 - 17;

    /* Slightly different paper sizes */
    const scale = 0.82 + Math.random() * 0.34;

    paper.style.transform =
        `rotate(${rotation}deg) scale(${scale})`;

    /*
       Later-created papers sit over earlier ones,
       creating the bunched-up layered appearance.
    */
    paper.style.zIndex = i + 1;

    /* Add a pushpin */
    const pin = document.createElement("div");
    pin.className = "pin";

    pin.style.background =
        pinColors[Math.floor(Math.random() * pinColors.length)];

    paper.appendChild(pin);
    board.appendChild(paper);
}
/* =========================
   ROBOT'S FIRST PAPER GRAB
   ========================= */

function robotFirstGrab() {

    const papers = document.querySelectorAll(".paper");

    if (papers.length === 0) return;

    /* Pick one paper from the right side of the board */
    const candidates = Array.from(papers).filter(paper => {
        return parseFloat(paper.style.left) > 55;
    });

    if (candidates.length === 0) return;

    const paper =
        candidates[Math.floor(Math.random() * candidates.length)];

    /*
       Bring the chosen paper above the others
       so we can clearly see Robot Robins take it.
    */
    paper.style.zIndex = "500";

    paper.style.transition =
        "transform 1.4s ease-in-out, " +
        "left 1.4s ease-in-out, " +
        "top 1.4s ease-in-out, " +
        "opacity .4s ease-in";

    /*
       Move the paper toward Robot Robins' hand.
    */
    setTimeout(() => {

        paper.style.left = "78%";
        paper.style.top = "55%";
        paper.style.transform =
            "rotate(18deg) scale(1.05)";

    }, 1200);

    /*
       Then Robot Robins pulls the paper
       off the right side of the screen.
    */
    setTimeout(() => {

        paper.style.left = "125%";
        paper.style.top = "58%";
        paper.style.transform =
            "rotate(55deg) scale(.9)";

    }, 2700);

    /*
       Remove the paper after it leaves.
    */
    setTimeout(() => {
        paper.remove();
    }, 4300);
}

/* Give the page a moment to settle, then do ONE grab */
setTimeout(robotFirstGrab, 2500);    
</script>

</body>
</html>
